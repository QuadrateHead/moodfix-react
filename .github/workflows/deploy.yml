name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ] # Укажи свою дефолтную ветку, если это master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
      VITE_APPWRITE_ENDPOINT: ${{ secrets.VITE_APPWRITE_ENDPOINT }}
      VITE_APPWRITE_PROJECT_ID: ${{ secrets.VITE_APPWRITE_PROJECT_ID }}
      VITE_APPWRITE_DATABASE_ID: ${{ secrets.VITE_APPWRITE_DATABASE_ID }}
      VITE_APPWRITE_TABLE_ID: ${{ secrets.VITE_APPWRITE_TABLE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Твоя текущая версия Node.js
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check build secrets
        run: |
          test -n "${VITE_TMDB_API_KEY}" || (echo 'VITE_TMDB_API_KEY is missing' && exit 1)
          test -n "${VITE_APPWRITE_ENDPOINT}" || (echo 'VITE_APPWRITE_ENDPOINT is missing' && exit 1)
          test -n "${VITE_APPWRITE_PROJECT_ID}" || (echo 'VITE_APPWRITE_PROJECT_ID is missing' && exit 1)
          test -n "${VITE_APPWRITE_DATABASE_ID}" || (echo 'VITE_APPWRITE_DATABASE_ID is missing' && exit 1)
          test -n "${VITE_APPWRITE_TABLE_ID}" || (echo 'VITE_APPWRITE_TABLE_ID is missing' && exit 1)
          echo 'Required VITE secrets are available.'

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4